<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center py-10">

  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Form Registrasi</h1>

    <form id="formRegister" action="dashboard.html" method="get" novalidate class="space-y-4">

      <!-- Username -->
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" id="username" name="username" placeholder="Minimal 3 karakter"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <p id="errUsername" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" name="password" placeholder="Minimal 8 karakter"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <p id="errPassword" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- Nama -->
      <div>
        <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">Nama</label>
        <input type="text" id="nama" name="nama" placeholder="Nama lengkap"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <p id="errNama" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- Tanggal Lahir -->
      <div>
        <label for="tanggalLahir" class="block text-sm font-medium text-gray-700 mb-1">Tanggal Lahir</label>
        <input type="date" id="tanggalLahir" name="tanggalLahir"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <p id="errTanggalLahir" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- Alamat -->
      <div>
        <label for="alamat" class="block text-sm font-medium text-gray-700 mb-1">Alamat</label>
        <textarea id="alamat" name="alamat" rows="3" placeholder="Alamat lengkap"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        <p id="errAlamat" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- Nomor Telpon -->
      <div>
        <label for="telpon" class="block text-sm font-medium text-gray-700 mb-1">Nomor Telpon</label>
        <input type="tel" id="telpon" name="telpon" placeholder="Contoh: 628123456789"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <p id="errTelpon" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
        Daftar
      </button>
    </form>
  </div>

  <script src="validasi_input.js"></script>
</body>
</html>
